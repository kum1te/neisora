name: Linux release checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTUP_TOOLCHAIN: 1.96.0
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libssl-dev librsvg2-dev patchelf libfuse2 mpv python3 python3-gi imagemagick zstd xvfb xauth xdotool dbus-x11 webkit2gtk-driver pulseaudio
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo apt-get update
          npm install --global pnpm@10.13.1
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          pnpm install --frozen-lockfile
          python3 tools/prepare-runtime.py
          python3 tools/prepare-notices.py
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-rust-1.96-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-rust-1.96-${{ hashFiles('src-tauri/Cargo.lock') }}-
            linux-rust-1.96-
      - name: Source checks
        run: |
          pnpm check
          node --experimental-strip-types --test tools/queue.test.ts tools/playback.test.ts tools/session.test.ts
          pnpm build
          python3 tools/check-release.py
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml glib_string_iterator_security_backport
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: WebKit regression and adversarial checks
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          pnpm exec vite build --mode test
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" sh tools/gui-checks.sh
          NEISORA_TEST_BINARY="$PWD/src-tauri/target/debug/neisora" dbus-run-session -- xvfb-run -a sh tools/audio-output-checks.sh
      - name: Production packages
        run: |
          sh tools/linux-release.sh
          python3 tools/prepare-appimage-sources.py
      - name: Production install (offline; online playback checked separately)
        run: |
          sudo apt-get install -y ./release/*.deb
          dbus-run-session -- xvfb-run -a sh tools/installed-checks.sh
      - name: AppImage local playback and helper checks
        run: |
          mkdir -p /tmp/neisora-ci-test-tools
          cp /usr/bin/WebKitWebDriver /tmp/neisora-ci-test-tools/
          patchelf --force-rpath --set-rpath '$ORIGIN/../lib' /tmp/neisora-ci-test-tools/WebKitWebDriver
          NEISORA_MATCHING_WEBKIT_DRIVER=/tmp/neisora-ci-test-tools/WebKitWebDriver dbus-run-session -- xvfb-run -a sh tools/appimage-checks.sh release/*.AppImage
          python3 tools/appimage-check.py release/*.AppImage
          python3 tools/appimage-audio-check.py --start-server release/*.AppImage
      - name: Dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock --json > release-audit.json
          mkdir -p /tmp/neisora-ci-test-tools
          cp "$HOME/.cargo/bin/tauri-driver" release-audit.json /tmp/neisora-ci-test-tools/
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-driver-and-audit
          path: /tmp/neisora-ci-test-tools/
  ubuntu24:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-packages
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: test-driver-and-audit
          path: test-tools
      - run: |
          sudo apt-get update
          sudo apt-get install -y ./release/*.deb xvfb xauth dbus-x11 webkit2gtk-driver pulseaudio
          chmod +x test-tools/tauri-driver
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/installed-checks.sh
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/appimage-checks.sh release/*.AppImage
          python3 tools/appimage-audio-check.py --start-server release/*.AppImage
  debian12:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:12
    env:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
    timeout-minutes: 15
    steps:
      - name: System test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 xvfb xauth dbus-x11 webkit2gtk-driver pulseaudio
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-packages
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: test-driver-and-audit
          path: test-tools
      - run: |
          apt-get install -y ./release/*.deb
          chmod +x test-tools/tauri-driver
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/installed-checks.sh
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/appimage-checks.sh release/*.AppImage
          python3 tools/appimage-audio-check.py --start-server release/*.AppImage
  fedora:
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
    timeout-minutes: 15
    steps:
      - name: System test dependencies
        run: dnf install -y git python3 xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools webkitgtk6.0 pulseaudio
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-packages
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: test-driver-and-audit
          path: test-tools
      - run: |
          dnf install -y ./release/*.rpm
          chmod +x test-tools/tauri-driver
          if test -x /usr/libexec/webkit2gtk-4.1/WebKitWebDriver; then export NEISORA_NATIVE_DRIVER=/usr/libexec/webkit2gtk-4.1/WebKitWebDriver; fi
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/installed-checks.sh
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/appimage-checks.sh release/*.AppImage
          python3 tools/appimage-audio-check.py --start-server release/*.AppImage
  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base
    env:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
    timeout-minutes: 15
    steps:
      - name: System test dependencies
        run: pacman -Syu --noconfirm git python xorg-server-xvfb xorg-xauth dbus webkit2gtk-4.1 webkitgtk-6.0 pulseaudio
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-packages
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: test-driver-and-audit
          path: test-tools
      - run: |
          pacman -U --noconfirm ./release/*.pkg.tar.zst
          chmod +x test-tools/tauri-driver
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/installed-checks.sh
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/appimage-checks.sh release/*.AppImage
          python3 tools/appimage-audio-check.py --start-server release/*.AppImage
