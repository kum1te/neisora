name: AppImage compatibility (reuse verified build)
on:
  push:
    branches: [test/appimage, 'test/appimage-reuse-*']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional completed compatibility run whose unchanged candidate should be retested
        required: false
        default: ''
      build_run_id:
        description: Successful Linux build run containing linux-packages and test-driver-and-audit artifacts
        required: true
        default: '39174907711'
permissions:
  contents: read
  actions: read
concurrency:
  group: appimage-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      candidate_run_id: ${{ steps.select.outputs.candidate_run_id }}
    steps:
      - id: select
        env:
          INPUT_RUN: ${{ inputs.candidate_run_id }}
        run: |
          candidate="$INPUT_RUN"
          case "$GITHUB_REF_NAME" in test/appimage-reuse-*) candidate="${GITHUB_REF_NAME#test/appimage-reuse-}";; esac
          if test -n "$candidate"; then
            case "$candidate" in *[!0-9]*) echo 'Invalid candidate run ID' >&2; exit 1;; esac
          fi
          echo "candidate_run_id=$candidate" >> "$GITHUB_OUTPUT"
  repackage:
    needs: source
    if: needs.source.outputs.candidate_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-packages
          path: release
          run-id: ${{ inputs.build_run_id || '39174907711' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: test-driver-and-audit
          path: test-tools
          run-id: ${{ inputs.build_run_id || '39174907711' }}
          github-token: ${{ github.token }}
      - name: Repackage the existing application with current AppImage staging
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev librsvg2-dev patchelf mpv python3 webkit2gtk-driver
          npm install --global pnpm@10.13.1
          pnpm install --frozen-lockfile
          tar -xzf release/neisora-linux-x86_64.tar.gz -C /tmp
          mkdir -p src-tauri/target/release src-tauri/resources
          cp /tmp/neisora/neisora src-tauri/target/release/neisora
          cp -a /tmp/neisora/runtime /tmp/neisora/licenses src-tauri/resources/
          python3 tools/prepare-appimage.py
          pnpm exec tauri bundle --verbose --bundles appimage --config artifacts/appimage.conf.json
          mkdir -p candidate
          cp src-tauri/target/release/bundle/appimage/*.AppImage candidate/
          cp /usr/bin/WebKitWebDriver test-tools/
          patchelf --force-rpath --set-rpath '$ORIGIN/../lib' test-tools/WebKitWebDriver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appimage-candidate
          path: candidate/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-drivers
          path: test-tools
          run-id: ${{ needs.source.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}/
          retention-days: 3
  image:
    needs: [source, repackage]
    if: always() && needs.source.result == 'success' && (needs.repackage.result == 'success' || needs.source.outputs.candidate_run_id != '')
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
        include:
          - distro: debian
            container: debian:12
          - distro: fedora
            container: fedora:44
          - distro: arch
            container: archlinux:base
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 15
    env:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
      LIBGL_DEBUG: verbose
      EGL_LOG_LEVEL: debug
      TEST_DISTRO: ${{ matrix.distro }}
    steps:
      - name: Minimal graphical test environment
        run: |
          case "$TEST_DISTRO" in
            debian)
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates git python3 xvfb xauth dbus-x11 fontconfig fonts-dejavu-core libgl1-mesa-dri libegl1 libgles2 libxkbcommon0 libasound2 libpulse0 pulseaudio
              ;;
            fedora)
              dnf install -y git python3 xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools fontconfig dejavu-sans-fonts mesa-dri-drivers mesa-libEGL mesa-libGL libglvnd-gles libxkbcommon alsa-lib 'libwayland-server.so.0()(64bit)' 'libpulse.so.0()(64bit)' pulseaudio
              ;;
            arch)
              pacman -Syu --noconfirm git python xorg-server-xvfb xorg-xauth dbus fontconfig ttf-dejavu mesa libxkbcommon alsa-lib libpulse pulseaudio
              ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: appimage-candidate
          path: release
          run-id: ${{ needs.source.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: candidate-drivers
          path: test-tools
          run-id: ${{ needs.source.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Bundled helpers and native playback without system mpv or WebKit
        run: |
          chmod +x test-tools/tauri-driver release/*.AppImage
          python3 tools/appimage-check.py release/*.AppImage
          python3 tools/appimage-audio-check.py --start-server release/*.AppImage
          PATH="$PWD/test-tools:$PATH" dbus-run-session -- xvfb-run -a sh tools/appimage-checks.sh release/*.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: appimage-diagnostics-${{ matrix.distro }}
          path: /tmp/neisora-installed-*/driver.log
          retention-days: 3
